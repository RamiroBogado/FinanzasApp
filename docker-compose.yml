services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["sh", "-c", "ollama serve & sleep 3 && ollama pull llama3.2 && tail -f /dev/null"]

  app:
    build: .
    container_name: finanzas-app
    ports:
      - "3001:3001"
    environment:
      - JWT_SECRET=finanzas-app-secret-key-2026
      - PORT=3001
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      - ollama

volumes:
  ollama_data:
