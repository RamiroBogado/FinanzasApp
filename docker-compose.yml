services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["sh", "-c", "ollama serve & sleep 3 && ollama pull llama3.2 && ollama pull nomic-embed-text && tail -f /dev/null"]
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q llama3.2 && ollama list | grep -q nomic-embed-text"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 180s

  app:
    build: .
    container_name: finanzas-app
    ports:
      - "3001:3001"
    environment:
      - JWT_SECRET=finanzas-app-secret-key-2026
      - PORT=3001
      - OLLAMA_URL=http://ollama:11434
      - AI_URL=http://finanzas-ai:3002
      - DB_PATH=/app/data/finanzas.db
    volumes:
      - finanzas_data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
    command: ["sh", "-c", "node seed.js && node src/server.js"]

  ai:
    build: ./ai
    container_name: finanzas-ai
    ports:
      - "3002:3002"
    environment:
      - JWT_SECRET=finanzas-app-secret-key-2026
      - OLLAMA_URL=http://ollama:11434
      - DB_PATH=/app/data/finanzas.db
      - CHROMA_DIR=/app/data/chroma
    volumes:
      - finanzas_data:/app/data
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_data:
  finanzas_data: